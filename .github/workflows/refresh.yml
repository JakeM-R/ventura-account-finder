name: Refresh accounts

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch suppliers from OpenStreetMap
        run: python3 scripts/fetch_accounts.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/accounts.json
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "Refresh accounts data"
          git pull --rebase origin main
          git push
